apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadow-cloud-api
  labels:
    app: shadow-cloud-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shadow-cloud-api
  template:
    metadata:
      labels:
        app: shadow-cloud-api
    spec:
      containers:
      - name: api
        image: shadow-ai/cloud-api:latest
        ports:
        - containerPort: 3000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: shadow-secrets
              key: openai-key
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: shadow-config
              key: database-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shadow-cloud-api-service
spec:
  selector:
    app: shadow-cloud-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
