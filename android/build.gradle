plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace "com.shedow.ai"
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
}
